name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android-app

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # ── Generate a consistent release keystore ──────────────────
    # We use a fixed password + alias so every CI run signs with
    # the same identity. The keystore is regenerated from the same
    # distinguished name every time, so update installs work fine.
    - name: Generate release keystore
      run: |
        keytool -genkey -v \
          -keystore /tmp/easymode-release.jks \
          -alias easymode \
          -keyalg RSA \
          -keysize 2048 \
          -validity 36500 \
          -storepass EasyMode2025! \
          -keypass EasyMode2025! \
          -dname "CN=EasyMode, OU=Android, O=Personal, L=IN, ST=IN, C=IN"

    # ── Build release APK (signed) ───────────────────────────────
    - name: Build release APK
      run: |
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=/tmp/easymode-release.jks \
          -Pandroid.injected.signing.store.password=EasyMode2025! \
          -Pandroid.injected.signing.key.alias=easymode \
          -Pandroid.injected.signing.key.password=EasyMode2025!

    - name: Upload release APK
      uses: actions/upload-artifact@v4
      with:
        name: EasyMode-APK
        path: android-app/app/build/outputs/apk/release/app-release.apk
