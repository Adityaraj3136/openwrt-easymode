name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android-app

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # We use a committed PKCS12 keystore so every CI run signs with
    # the exact same cryptographic key, allowing seamless app updates.
    
    # ── Build release APK (signed) ──────────────────────────────
    - name: Build release APK
      run: |
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=easymode-release.p12 \
          -Pandroid.injected.signing.store.password=EasyMode2025! \
          -Pandroid.injected.signing.key.alias=easymode \
          -Pandroid.injected.signing.key.password=EasyMode2025!

    - name: Upload release APK
      uses: actions/upload-artifact@v4
      with:
        name: EasyMode-APK
        path: android-app/app/build/outputs/apk/release/app-release.apk
